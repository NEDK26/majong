name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          pyinstaller==6.15.0

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test native Windows UI
        run: >-
          python -c
          "from desktop_app import desktop_ui_smoke_test; desktop_ui_smoke_test()"

      - name: Build single-file application
        shell: cmd
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --noconsole
          --name MahjongStudyAnalyzer
          --add-data "assets\ocr_templates;assets\ocr_templates"
          --add-data "assets\ocr_models;assets\ocr_models"
          --collect-all mahjong
          --collect-all dxcam
          main.py

      - name: Report executable size
        shell: pwsh
        run: |
          $size = (Get-Item dist\MahjongStudyAnalyzer.exe).Length
          $mib = [math]::Round($size / 1MB, 2)
          "Windows EXE: $mib MiB ($size bytes)" | Tee-Object -FilePath exe-size.txt
          "### Windows EXE: $mib MiB" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MahjongStudyAnalyzer-Windows
          path: |
            dist/MahjongStudyAnalyzer.exe
            exe-size.txt
          if-no-files-found: error

      - name: Smoke test packaged EXE
        timeout-minutes: 2
        shell: cmd
        run: dist\MahjongStudyAnalyzer.exe --smoke-test

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MahjongStudyAnalyzer.exe
          generate_release_notes: true
          body: |
            Windows 原生桌面单文件版本。下载 `MahjongStudyAnalyzer.exe` 后直接双击，
            不会启动浏览器，也不会开放本地网页端口。

            首次使用雀魂牌面识别时，请把 34 种牌总览图拖到 EXE 上完成本地校准，
            或在顶部条的“设置”中点击“校准雀魂牌面”。程序默认只有一条 72px
            高的顶部提示；点击“框选”可临时圈出暗牌区域。Windows 自动优先使用
            DXGI 捕获游戏画面，失败时退回 MSS。
