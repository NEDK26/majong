<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>牌理镜 · 本地研究面板</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow">LOCAL MAHJONG STUDY</p>
        <h1>牌理镜</h1>
        <p class="subtitle">框选画面，观察手牌结构的变化。</p>
      </div>
      <div class="privacy-mark">
        <span class="privacy-dot"></span>
        <div><strong>仅在本机运行</strong><small>127.0.0.1 · 不上传画面</small></div>
      </div>
    </header>

    <main class="workspace">
      <section class="capture-card panel">
        <div class="section-head">
          <div><span class="section-kicker">画面</span><h2>选择研究区域</h2></div>
          <span id="captureStatus" class="status-badge idle">待选择</span>
        </div>

        <div class="controls">
          <label>显示器<select id="monitorSelect"></select></label>
          <label>暗牌张数
            <select id="countSelect">
              <option value="">自动</option><option>14</option><option>13</option>
              <option>11</option><option>10</option><option>8</option><option>7</option>
              <option>5</option><option>4</option><option>2</option><option>1</option>
            </select>
          </label>
          <label>刷新间隔
            <select id="intervalSelect"><option value="1000">1 秒</option><option value="1500" selected>1.5 秒</option><option value="2500">2.5 秒</option></select>
          </label>
          <button id="refreshButton" class="button ghost">刷新预览</button>
          <button id="delayRefreshButton" class="button ghost">3 秒后抓取</button>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="screenCanvas" aria-label="显示器预览，拖动选择研究区域"></canvas>
          <div id="emptyPreview" class="empty-preview"><span>▱</span><p>正在读取显示器预览…</p></div>
        </div>

        <div class="selection-row">
          <p><span>框选区域</span><strong id="regionText">尚未选择</strong></p>
          <button id="bottomRegionButton" class="text-button">恢复底部区域</button>
        </div>

        <div class="actions">
          <button id="startButton" class="button primary">开始实时观察</button>
          <button id="onceButton" class="button secondary">分析一次</button>
          <button id="stopButton" class="button ghost" disabled>停止</button>
          <button id="exitButton" class="text-button exit-button">退出程序</button>
        </div>
      </section>

      <section class="analysis-card panel">
        <div class="section-head">
          <div><span class="section-kicker">判断</span><h2>当前牌理</h2></div>
          <time id="capturedAt">--:--:--</time>
        </div>

        <div id="errorBox" class="message-box" hidden></div>
        <div id="analysisEmpty" class="analysis-empty">
          <div class="empty-tile">?</div>
          <h3>等待第一帧</h3><p>先在左侧框住自己的暗牌区域。</p>
        </div>

        <div id="analysisContent" hidden>
          <div class="decision-grid">
            <div class="metric-block"><span>当前向听</span><strong id="shantenValue">—</strong></div>
            <div class="recommend-block"><span>推荐舍牌</span><div id="recommendTiles" class="recommend-tiles"></div></div>
          </div>

          <div class="rack-block">
            <div class="rack-title"><span>识别暗牌</span><small id="confidenceText"></small></div>
            <div id="tileRack" class="tile-rack"></div>
          </div>

          <div id="drawBlock" class="draw-block" hidden>
            <span>有效摸牌</span><div id="drawTiles" class="effective-list"></div>
          </div>

          <div class="candidate-block">
            <div class="table-head"><span>候选舍牌</span><small>先向听，后有效枚数</small></div>
            <div class="table-scroll">
              <table><thead><tr><th>舍牌</th><th>打后向听</th><th>有效进张</th><th>枚数</th></tr></thead><tbody id="candidateBody"></tbody></table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>仅供本地算法学习 · 不读取进程 · 不抓包 · 不执行操作</footer>
    <script src="/app.js" defer></script>
  </body>
</html>
